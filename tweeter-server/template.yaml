                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
                    responseTemplates:
                      application/json: '{}'

          /status/post:
            post:
              summary: Post a new status
              description: Posts a new status update to the feed/story (simulated for M3).
              consumes: *commonConsumes
              produces: *commonProduces
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${PostStatusAsyncFunction.Arn}/invocations
