  #
  # SQS Queue Lambda Functions  (This will become relevant in Milestone 4. For M3, leave this section commented out.)
  #

  #   MyQueueFunction:
  #     Type: AWS::Serverless::Function
  #     Properties:
  #       FunctionName: MyQueueFunction
  #       Handler: <PATH TO LAMBDA HANDLER>
  #       Policies: *commonPolicies
  #       Events:
  #         SQSTrigger:
  #           Type: SQS
  #           Properties:
  #             Queue: !GetAtt MyQueue.Arn
  #             Enabled: true
  FollowFetcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FollowFetcherFunction
      Handler: lambda/StatusAsyncHandlers.followFetcherHandler
      Policies: *commonPolicies
      Environment:
        Variables:
          JOB_QUEUE_URL: !Ref JobQueue
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt PostQueue.Arn
            BatchSize: 5
            Enabled: true
            MaximumBatchingWindowInSeconds: 1
  JobHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: JobHandlerFunction
      Handler: lambda/StatusAsyncHandlers.jobHandler
      Policies: *commonPolicies
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt JobQueue.Arn
            BatchSize: 5
            Enabled: true
            MaximumBatchingWindowInSeconds: 1


  #
  # DynamoDB Tables
  #

  followTable:  ##### TODO: Change to match the table name
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TweeterFollows
      AttributeDefinitions:
        - AttributeName: followerAlias
          AttributeType: S
        - AttributeName: followeeAlias
          AttributeType: S
      KeySchema:
        - AttributeName: followerAlias  ##### TODO: Set table partition key
          KeyType: HASH
        - AttributeName: followeeAlias  ##### TODO: Set table sort key
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      GlobalSecondaryIndexes:
        - IndexName: FolloweeIndex
          KeySchema:
            - AttributeName: followeeAlias  ##### TODO: Set index partition key
              KeyType: HASH
            - AttributeName: followerAlias  ##### TODO: Set index sort key
              KeyType: RANGE
          ProvisionedThroughput:
            ReadCapacityUnits: 1
            WriteCapacityUnits: 1
          Projection:
            ProjectionType: ALL
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TweeterUsers
      AttributeDefinitions:
        - AttributeName: alias
          AttributeType: S
      KeySchema:
        - AttributeName: alias
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  # 2. AuthToken Table
  AuthTokenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TweeterSessions
      AttributeDefinitions:
        - AttributeName: token
          AttributeType: S
      KeySchema:
        - AttributeName: token
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      TimeToLiveSpecification:
        AttributeName: timestamp
        Enabled: true

  # 3. Story Table (Composite Key: alias + timestamp)
  StoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TweeterStories
      AttributeDefinitions:
        - AttributeName: userAlias
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: userAlias
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1

  # 4. Feed Table (Composite Key: receiver_alias + timestamp)
  FeedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TweeterFeed
      AttributeDefinitions:
        - AttributeName: userAlias
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: userAlias
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5  # Higher write capacity recommended for batch writes
        WriteCapacityUnits: 5

  #
  # TODO: ADD MORE TABLE DEFINITIONS HERE
  #
  
  # S3 bucket for user profile images
  TweeterUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
  
